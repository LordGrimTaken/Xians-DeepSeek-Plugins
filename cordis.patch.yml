# Xian's DeepSeek Plugins — optional profile rows.
#
# Every row below is added DISABLED (`disabled: true`). This repository curates
# opinionated plugins, so nothing runs until YOU switch on what you want.
#
# How to use this file
#   - Copy the blocks (or individual rows) into your profile's
#     `cordis.patch.yml`, next to your DSH home:
#         ${DSH_HOME:-$HOME/.dsh}/profiles/<profile>/cordis.patch.yml
#   - Or run `scripts/install.sh --profile <profile>`, which installs the
#     packages, leaves each new bundle UNSELECTED (so it is off), and appends
#     exactly these rows for you.
#   - When copying rows by hand: a freshly initialized profile's
#     cordis.patch.yml holds the empty-list placeholder `[]`. Delete that line
#     first, or the appended rows form a second YAML document and the file stops
#     parsing. `scripts/install.sh` removes it for you.
#
# How to enable a plugin afterwards
#   1. Settings -> Plugins: switch the plugin on. This selects its bundle, so
#      the plugin's own bundle row mounts after a reload. The `xdp-<slug>` rows
#      here stay disabled duplicates on purpose: they are the canonical row ids
#      this repository documents, and they never override the bundle.
#      If you prefer to mount the row directly instead of selecting the bundle,
#      change that row to `disabled: false`.
#   2. Reload the Web page so the client half loads.
#   3. Restart the DSH host for plugins with a host-side half — mobile-host,
#      session-resume, system-monitor, browser-control, agent-team-plus,
#      run-hidden and game-lab.
#
# Row ids are prefixed `xdp-` so they never collide with the ids the plugin
# bundles themselves declare, and re-applying this file never duplicates a row.

# Agent teams
- insert:
    - id: xdp-agent-team-plus
      name: '@local/agent-team-plus'
      disabled: true

